services:
  item-app:
    image: rakafd/item-app:v1  # namaimage
    ports:
      - "8080:80" #remap port external 8080
    depends_on:
      - item-db
    environment:
      NODE_ENV: production
      DB_HOST: item-db
    restart: always

  item-db:
    image: mongo:3 #image mongo
    volumes:
      - app-db:/data/db #volum yang diarahkan ke /data/db
    restart: always

volumes:
  app-db: