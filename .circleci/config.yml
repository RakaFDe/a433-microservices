#config circle ci
version: 2.1 #versi circleci

#pakai orb circleci, seperti contoh di dokumentasi web circleci

orbs:
  docker: circleci/docker@3.0.1

#job / task
jobs:
#  lint-dockerfile-backend: #job untuk lint bnackend
#    docker:
#      - image: hadolint/hadolint:latest
#    steps:
#      - checkout
#      - run:
#          name: proses lint backend #nama proses/job
#          command: hadolint backend/Dockerfile #target file backend lint
#-------------------------------------------

#  lint-dockerfile-frontend: #lint frontend
#    docker:
